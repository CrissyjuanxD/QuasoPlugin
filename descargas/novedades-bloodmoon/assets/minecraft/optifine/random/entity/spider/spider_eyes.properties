# La arana BloodMoon tiene sus ojos en el atlas emisivo del JEM.
# Oculta la capa vanilla para que no ilumine UV ajenas a los ojos.
skins.1=4
name.1=iregex:.*Ara\u00f1a BloodMoon.*

# Conserva la capa de ojos del modelo floral existente.
skins.2=2
name.2=iregex:.*(Spider Floral|Ara\u00f1a Floral).*

# Las aranas normales conservan sus ojos vanilla.
skins.3=1
