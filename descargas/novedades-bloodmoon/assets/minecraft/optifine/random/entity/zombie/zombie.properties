# Texturas por nombre; evita variantes aleatorias en mobs normales.
# BloodMoon usa el atlas declarado en su JEM, no una skin aleatoria.
# Warden Cave; variante 3. El resto conserva vanilla o floral.
skins.1=3
name.1=iregex:.*(?:Warden Zombie|Infested Zombie).*

skins.2=2
name.2=iregex:.*Zombie Floral.*

skins.3=1
