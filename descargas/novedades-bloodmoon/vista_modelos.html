function project(v){let[x,y,z]=v.map((v,i)=>v-center[i]);let xx=x*Math.cos(yaw)+z*Math.sin(yaw),zz=-x*Math.sin(yaw)+z*Math.cos(yaw),yy=y*Math.cos(pitch)-zz*Math.sin(pitch);return [600+xx*scale,325-yy*scale,y*Math.sin(pitch)+zz*Math.cos(pitch)]}
let faces=[];for(let box of scene.cubes){let vs=coords(box).map(project);for(let[f,ids]of Object.entries(faceVerts)){let p=ids.map(i=>vs[i]);faces.push({box,f,p,depth:p.reduce((s,p)=>s+p[2],0)/4})}}faces.sort((a,b)=>b.depth-a.depth);
for(let{box,f,p}of faces){let texture=box.faces?box.faces[f].texture.slice(1):'skin',im=images[idx][texture];if(!im?.complete)continue;let[u,v,U,V]=faceUV(box,f);if(box.mirror)[u,U]=[U,u];if(box.ghast)[v,V]=[V,v];const uv=[[u,V],[U,V],[U,v],[u,v]];triangle(im,[p[0],p[1],p[2]],[uv[0],uv[1],uv[2]]);triangle(im,[p[0],p[2],p[3]],[uv[0],uv[2],uv[3]])}}
pick.onchange=()=>{idx=+pick.value;draw()};document.getElementById('reset').onclick=()=>{yaw=-.55;pitch=.18;zoom=1;draw()};let prev=null;cvs.onpointerdown=e=>{prev=[e.clientX,e.clientY];cvs.setPointerCapture(e.pointerId)};cvs.onpointermove=e=>{if(!prev)return;yaw+=(e.clientX-prev[0])*.008;pitch=Math.max(-1,Math.min(1,pitch+(e.clientY-prev[1])*.006));prev=[e.clientX,e.clientY];draw()};cvs.onpointerup=()=>prev=null;cvs.onwheel=e=>{e.preventDefault();zoom=Math.max(.5,Math.min(2,zoom*Math.exp(-e.deltaY*.001)));draw()};draw();</script></html>
